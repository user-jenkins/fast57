name: CI
on: [push]
jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    steps:
    - name: Checkout code
      uses: actions/checkout@v2
    - name: Login to AWS
      uses: aws-actions/login@v1
    - name: Build and push Docker image
      uses: docker/build-push-action@v2
    - name: Deploy to EKS
      uses: aws-actions/eks-deploy@v1